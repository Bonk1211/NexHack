<!doctype html>
<html lang="en">
<!--
  Planted-flaw fixture site (§20, §22). The demo target with REPRODUCIBLE
  exclusion flaws so persona failures are deterministic. Contract tests assert
  these known issues are caught and a clean control screen returns none.

  Planted flaws (each maps to a WCAG criterion the trusted stream should catch):
    - OTP input has NO label / aria-label        -> 1.3.1, 4.1.2  (blocks oku_visual at a critical step => P0)
    - "Submit" CTA contrast ~2.0:1 (fails AA)     -> 1.4.3
    - tap target 24x24px (below 44/48)            -> 2.5.8        (blocks oku_motor)
    - dense jargon-heavy copy, high reading grade -> low_literacy friction
  Keep a CLEAN control screen (see /control.html, TODO) that returns no violations.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DemoBank — Verify</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
    /* FLAW: contrast ~2:1, fails WCAG 1.4.3 AA */
    .cta { background:#bfc6cf; color:#dfe3e8; border:none; padding:10px 16px; border-radius:6px; }
    /* FLAW: 24px tap target, fails 2.5.8 */
    .icon-btn { width:24px; height:24px; padding:0; }
  </style>
</head>
<body>
  <h1>Verify your identity</h1>
  <!-- FLAW: dense jargon copy, high reading grade -> low_literacy friction -->
  <p>
    Pursuant to regulatory KYC obligations, kindly furnish the one-time
    passcode disseminated to your registered telecommunications endpoint to
    facilitate authentication and subsequent provisioning of services.
  </p>

  <form>
    <!-- FLAW: OTP input has no <label> and no aria-label -> 1.3.1 / 4.1.2 -->
    <input type="text" id="otp" inputmode="numeric" placeholder="" />
    <button class="cta" type="submit">Submit</button>
    <button class="icon-btn" aria-hidden="true">?</button>
  </form>
</body>
</html>
