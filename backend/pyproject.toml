[project]
name = "inclusionscope-backend"
version = "0.1.0"
description = "InclusionScope — inclusion & accessibility assurance agent (NexHack 2026)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "playwright>=1.45",              # mobile emulation + CDP throttling (§15)
    "axe-playwright-python>=0.1.4",  # trusted WCAG signals (§10) — axe-core bridge
    "supabase>=2.5",                 # Postgres + Storage (§15)
    "httpx>=0.27",
    "reportlab>=4.0",                # audit-style PDF evidence pack (§13)
    "langgraph>=0.2",                # agent graphs: persona subgraph + run map-reduce (§8, §15)
    "langgraph-checkpoint-sqlite>=2.0",  # per-persona crash-resume (§8 run graph)
    "langchain-deepseek>=0.1",       # DeepSeek V4 LLM nodes — comprehend + synthesize (§15, §25 LOCKED)
    "langchain-core>=0.3",           # message/structured-output primitives
    "dashscope>=1.25.23",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["app*"]
