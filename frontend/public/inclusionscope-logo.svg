<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" width="660" height="180">
  <g>
    <!-- scan ring -->
    <circle cx="90" cy="90" r="64" fill="none" stroke="#d97a2b" stroke-width="16"
      stroke-linecap="round" stroke-dasharray="330 72.2" transform="rotate(-38 90 90)" />
    <!-- blue accent cap sitting in the ring's gap -->
    <circle cx="90" cy="90" r="64" fill="none" stroke="#2f8fe0" stroke-width="16"
      stroke-linecap="round" stroke-dasharray="26 376.2" transform="rotate(242 90 90)" />
    <!-- checkmark -->
    <path d="M 66 92 L 82 108 L 116 72" fill="none" stroke="#f5f5f7" stroke-width="10"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="210" y="106" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="52">
    <tspan fill="#f5f5f7">Inclusion</tspan><tspan fill="#d97a2b">Scope</tspan>
  </text>
</svg>
